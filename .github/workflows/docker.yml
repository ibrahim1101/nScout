name: docker-nscout

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build nScout image
        run: docker compose build nscout

      - name: Start stack
        run: docker compose up -d

      - name: Wait for nScout health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/ > /tmp/nscout-health.json; then
              cat /tmp/nscout-health.json
              exit 0
            fi
            echo "Waiting for nScout... ($i/30)"
            sleep 2
          done
          echo "nScout did not become ready in time"
          docker compose logs nscout mongo
          exit 1

      - name: Verify API response
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/api/", timeout=10) as response:
              data = json.load(response)

          assert data.get("name") == "nScout", data
          assert data.get("status") == "ok", data
          print("nScout Docker smoke test: OK")
          PY

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color nscout mongo

      - name: Stop stack
        if: always()
        run: docker compose down -v
