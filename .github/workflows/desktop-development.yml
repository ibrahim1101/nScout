name: desktop-development

on:
  pull_request:
    branches: ["main"]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - "nscout-sidecar.spec"
      - ".github/workflows/desktop-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r backend/requirements.txt
          npm install --global yarn@1.22.22

      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          DISABLE_EMERGENT_OVERLAY: "true"
        shell: bash
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else yarn install; fi
          yarn build
          test -f build/index.html

      - name: Build hidden backend sidecar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean nscout-sidecar.spec
          if (-not (Test-Path dist\nscout-backend.exe)) { throw "Sidecar build missing" }
          New-Item -ItemType Directory -Force desktop\src-tauri\binaries | Out-Null
          Copy-Item dist\nscout-backend.exe desktop\src-tauri\binaries\nscout-backend-x86_64-pc-windows-msvc.exe

      - name: Build development-only Tauri installer
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run tauri build -- --bundles nsis

      - name: Upload development installer
        uses: actions/upload-artifact@v4
        with:
          name: nScout-v0.4-desktop-development
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
