name: backend-pcap-integrity

on:
  push:
    branches: ["v0.4-investigation-platform"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pcap-integrity.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pcap-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcap-upload-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backend Python syntax
        run: python -m compileall -q backend
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-xdist
      - name: Run PCAP import integrity regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_pcap_upload_integrity.py
