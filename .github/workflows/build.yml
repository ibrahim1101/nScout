name: build-nscout-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller
          python -m pip install -v -r backend/requirements.txt
      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
        shell: bash
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else yarn install; fi
          yarn build
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean nscout.spec
      - name: Add README to bundle
        run: Copy-Item BUNDLE_README.md dist\nScout\README.md
      - name: Zip bundle
        run: Compress-Archive -Path dist\nScout\* -DestinationPath nScout-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nScout-windows-x64
          path: nScout-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nScout-windows-x64.zip
