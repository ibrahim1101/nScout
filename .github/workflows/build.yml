name: build-nscout

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r backend/requirements.txt
      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean nscout.spec
      - name: Add README to bundle
        run: Copy-Item BUNDLE_README.md dist\nScout\README.md
      - name: Zip bundle
        run: Compress-Archive -Path dist\nScout\* -DestinationPath nScout-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nScout-windows-x64
          path: nScout-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nScout-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r backend/requirements.txt
      - working-directory: frontend
        env: { REACT_APP_BACKEND_URL: "" }
        run: |
          yarn install --frozen-lockfile
          yarn build
      - run: pyinstaller --noconfirm --clean nscout.spec
      - run: cp BUNDLE_README.md dist/nScout/README.md
      - run: tar -czvf nScout-linux-x64.tar.gz -C dist nScout
      - uses: actions/upload-artifact@v4
        with:
          name: nScout-linux-x64
          path: nScout-linux-x64.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nScout-linux-x64.tar.gz

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tag
        id: tag
        run: |
          REF="${GITHUB_REF##*/}"
          echo "image=ghcr.io/${{ github.repository_owner }}/nscout:${REF}" >> $GITHUB_OUTPUT
          echo "latest=ghcr.io/${{ github.repository_owner }}/nscout:latest" >> $GITHUB_OUTPUT
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
