name: build-etherlens

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable Corepack (Yarn)
        run: corepack enable
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r backend/requirements.txt
      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean etherlens.spec
      - name: Add README to bundle
        run: Copy-Item BUNDLE_README.md dist\EtherLens\README.md
      - name: Zip bundle
        run: Compress-Archive -Path dist\EtherLens\* -DestinationPath EtherLens-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EtherLens-windows-x64
          path: EtherLens-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EtherLens-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r backend/requirements.txt
      - working-directory: frontend
        env: { REACT_APP_BACKEND_URL: "" }
        run: |
          yarn install --frozen-lockfile
          yarn build
      - run: pyinstaller --noconfirm --clean etherlens.spec
      - run: cp BUNDLE_README.md dist/EtherLens/README.md
      - run: tar -czvf EtherLens-linux-x64.tar.gz -C dist EtherLens
      - uses: actions/upload-artifact@v4
        with:
          name: EtherLens-linux-x64
          path: EtherLens-linux-x64.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EtherLens-linux-x64.tar.gz
