name: build-nscout-windows

on:
  push:
    branches: ["main", "v0.3-security-intelligence"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: focused-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip check
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run focused regression suite
        working-directory: backend
        run: >-
          python -m pytest -q
          --ignore=tests/backend_test.py
          --ignore=tests/test_v2_features.py
          --ignore=tests/test_v3_features.py

  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Yarn
        shell: pwsh
        run: npm install --global yarn@1.22.22
      - name: Install Python deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m pip --version
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade pyinstaller
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Verify backend imports
        shell: pwsh
        run: |
          python -m compileall -q backend
          $env:MONGO_URL = "mongodb://localhost:27017"
          $env:DB_NAME = "nscout"
          python -c "import sys; sys.path.insert(0, 'backend'); import launcher; print('launcher import: OK')"

      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          DISABLE_EMERGENT_OVERLAY: "true"
        shell: bash
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else yarn install; fi
          yarn build
          test -f build/index.html

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean nscout.spec

      - name: Add README to bundle
        run: Copy-Item BUNDLE_README.md dist\nScout\README.md

      - name: Zip portable bundle
        run: Compress-Archive -Path dist\nScout\* -DestinationPath nScout-windows-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $env:NSCOUT_VERSION = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $env:NSCOUT_VERSION = "0.3.0-dev"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\nScout.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-output

      - uses: actions/upload-artifact@v4
        with:
          name: nScout-windows-x64
          path: |
            nScout-windows-x64.zip
            installer-output/*.exe
          if-no-files-found: error

      - name: Attach portable ZIP and installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nScout-windows-x64.zip
            installer-output/*.exe
