name: build-nscout-windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Yarn
        shell: pwsh
        run: npm install --global yarn@1.22.22
      - name: Install Python deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python -m pip --version
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade pyinstaller
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Verify backend imports
        shell: pwsh
        run: |
          python -m compileall -q backend
          $env:MONGO_URL = "mongodb://localhost:27017"
          $env:DB_NAME = "nscout"
          python -c "import sys; sys.path.insert(0, 'backend'); import launcher; print('launcher import: OK')"

      - name: Build React UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
        shell: bash
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else yarn install; fi
          yarn build
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean nscout.spec
      - name: Add README to bundle
        run: Copy-Item BUNDLE_README.md dist\nScout\README.md
      - name: Zip bundle
        run: Compress-Archive -Path dist\nScout\* -DestinationPath nScout-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nScout-windows-x64
          path: nScout-windows-x64.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: nScout-windows-x64.zip
