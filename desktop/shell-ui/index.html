<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nScout</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090d16; color: #e2e8f0; }
      main { width: min(34rem, calc(100vw - 3rem)); text-align: center; }
      .mark { width: 5rem; height: 5rem; margin: auto; display: grid; place-items: center; border: 1px solid #1d4ed8; border-radius: 1.1rem; background: linear-gradient(145deg, #172554, #0f172a); color: #60a5fa; font-size: 2.2rem; font-weight: 800; }
      h1 { margin: 1.2rem 0 .4rem; font-size: 1.7rem; }
      p { color: #94a3b8; line-height: 1.55; }
      .pulse { width: 2.2rem; height: .25rem; margin: 1.5rem auto; border-radius: 99px; background: #3b82f6; animation: pulse 1.1s ease-in-out infinite alternate; }
      @keyframes pulse { to { width: 8rem; opacity: .35; } }
    </style>
  </head>
  <body>
    <main id="startup-status">
      <div class="mark" aria-hidden="true">nS</div>
      <h1>Starting nScout</h1>
      <p role="status" aria-live="polite" id="startup-message">Preparing the local analysis engine. The first launch may take 10–20 seconds while Windows initializes the bundled backend.</p>
      <p id="startup-elapsed" aria-live="off">Starting…</p>
      <div class="pulse" aria-label="Starting"></div>
    </main>
    <script>
      const started = Date.now();
      const elapsed = document.getElementById("startup-elapsed");
      const progress = setInterval(() => {
        if (!elapsed.isConnected) { clearInterval(progress); return; }
        const seconds = Math.floor((Date.now() - started) / 1000);
        elapsed.textContent = `Initializing locally · ${seconds}s elapsed`;
        if (seconds >= 10) document.getElementById("startup-message").textContent = "Still preparing the backend. nScout will open automatically when it is ready.";
      }, 1000);
    </script>
  </body>
</html>
