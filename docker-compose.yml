# nScout - lite web service (single app container + Mongo)
#
# Quick start:
#   docker compose up -d
#   open http://localhost:8001
#
# With live packet capture (Linux host, needs root):
#   docker compose -f docker-compose.yml -f docker-compose.capture.yml up -d
#
# Everything persists in a named volume so your saved sessions survive restarts.

services:
  nscout:
    build: .
    image: nscout:latest
    container_name: nscout
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: nscout
      CORS_ORIGINS: "*"
      # Paste your Emergent universal key here (or export it in a .env next to this file)
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY:-}"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: nscout-mongo
    restart: unless-stopped
    volumes:
      - nscout_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  nscout_mongo:
